name: Feature request
description: Something Kapto should do that it doesn't.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: The problem, from your robot or your data, rather than a solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you deal with it today
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. How it could work in Kapto.
