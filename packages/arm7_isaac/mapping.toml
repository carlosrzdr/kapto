# Which decoded value drives which joint of urdf/arm7.urdf: each joint's
# position from the `arm_joints` stream declared in streams.toml.
# `gripper_mirror` follows `gripper` by itself.
[joints]
joint_1 = "arm_joints.joint_1"
joint_2 = "arm_joints.joint_2"
joint_3 = "arm_joints.joint_3"
joint_4 = "arm_joints.joint_4"
joint_5 = "arm_joints.joint_5"
joint_6 = "arm_joints.joint_6"
joint_7 = "arm_joints.joint_7"
gripper = "arm_joints.gripper"

# What other values are for, whatever the robot calls them. Each joint
# above plays its own role already: joints.<joint>.position.
[roles]
"gripper.opening" = "arm_joints.gripper"
# The simulation's time, from its /clock, which Isaac Sim gives in
# simulated seconds.
"time.simulated" = "clock.time"
