# Which decoded value drives which joint of urdf/arm7.urdf: the seven
# joint positions and the gripper opening of the `arm_joints` stream
# declared in streams.toml. `gripper_mirror` follows `gripper` by itself.
[joints]
joint_1 = "arm_joints.joint_positions[0]"
joint_2 = "arm_joints.joint_positions[1]"
joint_3 = "arm_joints.joint_positions[2]"
joint_4 = "arm_joints.joint_positions[3]"
joint_5 = "arm_joints.joint_positions[4]"
joint_6 = "arm_joints.joint_positions[5]"
joint_7 = "arm_joints.joint_positions[6]"
gripper = "arm_joints.gripper"

# What other values are for, whatever the robot calls them. Each joint
# above plays its own role already: joints.<joint>.position.
[roles]
"gripper.opening" = "arm_joints.gripper"
