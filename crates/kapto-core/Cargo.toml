[package]
name = "kapto-core"
description = "Shared types used by every Kapto crate: identifiers, timestamps, roles and errors with cause codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rustix.workspace = true
# Spans for `cargo xtask profile trace`: only with `profiling`.
tracing = { workspace = true, optional = true }

[features]
# Named places tests can hold or end a process at (`failpoint!`).
# Development only: release builds and images never have it.
failpoints = []
# Spans marking capture's stages and the worker's jobs, for profiling in
# development. Release builds and images never have it.
profiling = ["dep:tracing"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
