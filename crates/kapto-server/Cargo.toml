[package]
name = "kapto-server"
description = "The Kapto daemon: process supervisor, local REST and WebSocket API, and the embedded web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `ws`: the event stream; axum's own WebSocket support (tokio-tungstenite).
axum = { workspace = true, features = ["ws"] }
kapto-capture.workspace = true
kapto-config.workspace = true
kapto-core.workspace = true
kapto-qa.workspace = true
kapto-robot.workspace = true
kapto-store.workspace = true
# Testing a destination from the web UI, with the probe `kapto upload check`
# writes; its stores are already in the binary for the worker's uploads.
kapto-upload.workspace = true
# Replay views, read to answer for a stretch of an episode.
kapto-viz.workspace = true
# `param`: the clock tick rate, to turn CPU time in `/proc` into seconds;
# `fs`: the data directory's free space.
rustix = { workspace = true, features = ["fs", "param", "process"] }
serde.workspace = true
serde_json.workspace = true
# `sync`: passing what capture announces on to every event stream; `fs`:
# sending a replay file without reading it all first.
tokio = { workspace = true, features = ["fs", "macros", "sync"] }
# `io`: a file as a stream of chunks, for a replay's body. Already in the
# tree through axum's dependencies.
utoipa.workspace = true

[dev-dependencies]
proptest.workspace = true
kapto-testkit.workspace = true
# A WebSocket client for the event stream's tests; both already come with axum.
futures-util = { version = "0.3", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
tower.workspace = true

[lints]
workspace = true
