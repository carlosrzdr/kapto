<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kapto</title>
  </head>
  <body>
    <h1>This Kapto was built without its web UI</h1>
    <p>Kapto itself is running; its API answers under <code>/api</code>.</p>
    <p>
      To include the UI, build it with <code>cargo xtask ui build</code> (needs
      Docker), then build Kapto again; or use the container image, which always
      includes it.
    </p>
  </body>
</html>
