[package]
name = "xtask"
description = "Developer automation for the Kapto repository, run as `cargo xtask <command>`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
# Only the command-line definition, for the reference pages: without the
# viewer, which `cargo xtask` doesn't need.
kapto-cli.workspace = true
# The recording's capture record, for its reference page.
kapto-capture.workspace = true
kapto-config.workspace = true
kapto-core.workspace = true
kapto-decode.workspace = true
kapto-robot.workspace = true
kapto-server.workspace = true
kapto-store.workspace = true
# Rust's symbols in a profile, which `perf` leaves mangled.
rustc-demangle.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
# A page of the live view, for `bench viewer`; already in the tree for the
# viewer bridge.
tungstenite.workspace = true

[lints]
workspace = true
