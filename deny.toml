# Dependency policy, checked by `cargo xtask ci` with cargo-deny.

[graph]
all-features = true

[advisories]
# Known vulnerabilities fail the check; so do crates yanked from crates.io.
yanked = "deny"
# Each ignored advisory names its reason and when to revisit it.
ignore = [
    # `paste` is unmaintained, not vulnerable. It is a compile-time macro
    # used by `mcap`, so none of its code is in Kapto's binaries. Revisit
    # when `mcap` replaces it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro used by mcap; no runtime code" },
]

[licenses]
# Permissive licences only, so everything Kapto ships stays usable under
# Apache-2.0. Adding a licence here needs a reason in the pull request.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # The Boost licence: permissive, no notice needed in binaries.
    "BSL-1.0",
    # Mozilla's root certificates as data (`webpki-root-certs`, through the
    # cloud stores' TLS): permissive, attribution only.
    "CDLA-Permissive-2.0",
    # The Independent JPEG Group's licence, beside MIT or Apache-2.0, of
    # `jpeg-encoder`, which the synthetic robot's camera encodes its frames
    # with: permissive, asking whoever distributes it to say it is based on
    # the IJG's work, which NOTICE does. Not in Kapto's binaries.
    "IJG",
]
confidence-threshold = 0.93
# The list is policy, not inventory: allowed licences no dependency uses yet are fine.
unused-allowed-license = "allow"

[bans]
# Duplicate versions are reported but allowed; large crates get explicit bans
# when they arrive.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io; no other registries or git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
