# The demo's configuration in Compose (`docker compose --profile demo up`):
# its episodes go up to the RustFS server beside it, reached by its service
# name. Credentials are read from LOCAL_ACCESS_KEY_ID and
# LOCAL_SECRET_ACCESS_KEY, which compose.yaml sets to the test server's.

[[upload.destination]]
name = "local"
url = "s3://kapto"
endpoint = "http://rustfs:9000"
region = "us-east-1"
credentials = { env = "LOCAL" }
